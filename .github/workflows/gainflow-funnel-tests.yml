name: GainFlow funnel validation

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'sales/**'
      - 'offer/**'
      - 'perfectpay-checkouts.json'
      - 'tests/**'
      - '.github/workflows/gainflow-funnel-tests.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
